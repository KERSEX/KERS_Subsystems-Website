name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Einmal taeglich, damit ein neuer Release auch ohne Push hier ankommt:
  # Bausteinliste, Version, Dateigroesse und die Versions-Weichen zieht der
  # Lauf unten frisch nach.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein laufendes Deployment NICHT abbrechen: Pages laesst immer nur eines zu, und
# ein abgebrochenes blockiert das naechste ("due to in progress deployment").
# Neue Laeufe warten stattdessen, bis das vorige durch ist.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Das Hauptprojekt daneben legen - daraus kommen Namen und Reihenfolge der
      # Bausteine. Im Stand des neuesten Releases, nicht des Standardzweigs: die
      # Seite beschreibt, was der Download-Knopf liefert, und an der naechsten
      # Version wird auf eigenen Zweigen gebaut (0.3.0 auf cpp-0.3.0). Ohne
      # Release faellt der Checkout auf den Standardzweig zurueck.
      - name: Neuesten Release ermitteln
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo KERSEX/KERS_Overlay --json tagName --jq .tagName 2>/dev/null || true)
          echo "Neuester Release: ${tag:-keiner gefunden - nehme den Standardzweig}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: KERSEX/KERS_Overlay
          ref: ${{ steps.release.outputs.tag }}
          path: .overlay
          fetch-depth: 1

      # Schreibt ausserdem seiten/stand.json - danach stellt der naechste Schritt
      # die Weichen fuer Text, der erst ab einer bestimmten Version stimmt. Ein
      # neuer Release geht so spaetestens mit dem naechsten Tageslauf live; sofort
      # geht es von Hand ueber "Run workflow".
      - name: Bausteinliste, Version und Groesse nachziehen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/bausteine.py --overlay .overlay

      - name: Seiten aus dem Rahmen bauen
        run: python3 tools/seiten.py

      # Der Checkout des Overlays gehoert nicht in die veroeffentlichte Seite.
      - name: Aufraeumen
        run: rm -rf .overlay

      # Einmalig von Hand noetig: Settings -> Pages -> Source auf "GitHub Actions".
      # Der Workflow kann das nicht selbst nachholen - der Token darf Pages nicht
      # anlegen ("Resource not accessible by integration"). Solange es fehlt,
      # bricht dieser Schritt mit "Get Pages site failed: Not Found" ab.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
