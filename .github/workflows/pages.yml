name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein laufendes Deployment NICHT abbrechen: Pages laesst immer nur eines zu, und
# ein abgebrochenes blockiert das naechste ("due to in progress deployment").
# Neue Laeufe warten stattdessen, bis das vorige durch ist.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Einmalig von Hand noetig: Settings -> Pages -> Source auf "GitHub Actions".
      # Der Workflow kann das nicht selbst nachholen - der Token darf Pages nicht
      # anlegen ("Resource not accessible by integration"). Solange es fehlt,
      # bricht dieser Schritt mit "Get Pages site failed: Not Found" ab.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
